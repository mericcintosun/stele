<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="Stele">
  <title>Stele</title>
  <!-- The horizontal lockup: the slab from app/icon.svg, then the wordmark.
       This is an asset under public/, so literal colors are allowed here. They
       are copied by hand from the @theme block in app/globals.css:
         #5eead4 is --color-acc, #e8edf6 is --color-ink.
       If a token moves there, move it here too. -->
  <g transform="translate(4 8)">
    <g fill="none" stroke="#5eead4" stroke-width="2" stroke-linejoin="round">
      <path d="M11 28V9a5 5 0 0 1 10 0v19z" />
    </g>
    <g fill="#5eead4">
      <rect x="14" y="12" width="4" height="1.6" rx="0.8" />
      <rect x="14" y="16" width="4" height="1.6" rx="0.8" />
      <rect x="14" y="20" width="4" height="1.6" rx="0.8" />
      <rect x="8" y="28" width="16" height="2.4" rx="1.2" />
    </g>
  </g>
  <text
    x="44"
    y="32"
    fill="#e8edf6"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.5"
  >Stele</text>
  <text
    x="122"
    y="32"
    fill="#5eead4"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="11"
    letter-spacing="1.5"
  >AI WARS II</text>
</svg>
